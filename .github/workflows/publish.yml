# Generated by npm-dual-publish. Edit the template, not this file.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish; empty takes the ref the run was started from'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  publish:
    uses: intisy/workflows/.github/workflows/publish-npm.yml@main
    with:
      unscoped_name: 'claude-code-proxy'
      scope: 'intisy-ai'
      patch_ceiling: 20
      scoped_only: true
      needs_java: true
      jar_module: 'claude-code-proxy-plugin'
      jar_pretest_task: 'claude-code-proxy-plugin:test'
      tag: ${{ inputs.tag }}
