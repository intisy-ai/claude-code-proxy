import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :claude-code-proxy-plugin -- AnthropicRateLimit.synthCore is the transpilable "core" this
    // export reuses verbatim. :claude-code-proxy-plugin itself only `compileOnly`s :routing
    // (keeping its shipped jar thin) -- that does NOT propagate to us, so :routing is declared
    // again below for the SPI types (RoutingProfile.Synth) ClaudeProxyJs references directly.
    implementation project(":claude-code-proxy-plugin")
    githubImplementation "intisy-ai:basekit:4.2.0:proxy-contracts"
    githubImplementation "intisy:bayonet:1.7.0:contract"
    // :js-base's TeaVM service implementations (SimpleJsonCodec), reused rather than duplicated;
    // ClaudeProxyJs lives in the SAME package (io.github.intisy.ai.js) so it references them
    // unqualified, exactly like CoreProxyJs and every provider's own export surface do.
    githubImplementation "intisy:bayonet:1.7.0:seam"
    githubImplementation "intisy:bayonet:1.7.0:js-base"
    // The emission annotations are SOURCE-retention, so nothing here reaches the bundle. A release
    // asset carries no transitive metadata, so the processor's own annotation types are named again
    // alongside the compile classpath's copy.
    githubCompileOnly "intisy:bayonet:1.7.0:annotations"
    githubAnnotationProcessor "intisy:bayonet:1.7.0:processor"
    githubAnnotationProcessor "intisy:bayonet:1.7.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :claude-code-proxy-plugin. TeaVM 0.15.0's own
// classlib/jso-apis/extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so
// :claude-code-proxy-teavm needs a newer compile target -- override both the extension's
// compatibility (fixes Gradle's dependency-resolution JVM-version attribute matching) and the
// compileJava task's --release option. Mirrors claude-teavm's build.gradle exactly.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    options.compilerArgs << "-Atsemit.name=anthropic-rate-limit.teavm"
}

// Same JVM-version attribute matching problem as compileJava, now that the root block also
// pins compileTestJava to release 8: this module's test classpath depends on project :teavm,
// which requires 17.
tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.ClaudeProxyJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "anthropic-rate-limit.js"
}
