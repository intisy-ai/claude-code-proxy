plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "claude-code-proxy-java"

// Alias :routing (SPIs incl. ProxyPlugin, RoutingProfile, RateLimitInfo) and :teavm (SimpleJsonCodec
// js-base) from the nested core-proxy submodule, exactly as every provider's java/settings.gradle does.
include ":routing"
project(":routing").projectDir = file("../core-proxy/java/routing")
include ":teavm"
project(":teavm").projectDir = file("../core-proxy/java/teavm")

// :spi and :js-base - the plugin-to-host contract the engine routes against, and the TeaVM
// implementations of its host-injected services. They live in core-contracts, reached through
// core-proxy's own clone of it, exactly as an app-proxy reaches :ir through its own core-ir below.
include ":spi"
project(":spi").projectDir = file("../core-proxy/core-contracts/java/spi")

include ":js-base"
project(":js-base").projectDir = file("../core-proxy/core-contracts/java/js-base")

// :ir - core-ir's canonical IR types + vendor translators (AnthropicTranslator etc.), aliased in
// exactly like :routing/:teavm above. core-ir is a DIRECT submodule of claude-code-proxy
// (../core-ir from here, i.e. claude-code-proxy/core-ir), not nested inside core-proxy.
// :routing's build.gradle references project(":ir") so this alias must resolve wherever
// :routing is included, exactly as claude-code-auth's java/settings.gradle does.
include ":ir"
project(":ir").projectDir = file("../core-ir/java/ir")

// :claude-code-proxy-plugin, the publishable *-proxy*.jar (ClaudeCodeProxyPlugin + AnthropicRateLimit).
include ":claude-code-proxy-plugin"
// :claude-code-proxy-teavm, TeaVM JS export of AnthropicRateLimit.synthCore.
include ":claude-code-proxy-teavm"
